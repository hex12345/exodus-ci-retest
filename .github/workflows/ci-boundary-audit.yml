name: CI boundary audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect safe metadata only
        shell: bash
        run: |
          set -euo pipefail
          echo "event=${{ github.event_name }}"
          echo "actor=${{ github.actor }}"
          echo "head_repo=${{ github.event.pull_request.head.repo.full_name || 'n/a' }}"
          echo "base_repo=${{ github.repository }}"
          echo "No credentials are read or exported by this fixture."
